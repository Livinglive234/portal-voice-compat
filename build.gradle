plugins {
    id "net.fabricmc.fabric-loom-remap" version "1.17.21"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// Declared here rather than in settings.gradle: Loom adds project-level repositories,
// which makes Gradle ignore any declared in settings.
repositories {
    mavenCentral()
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
    maven {
        name = "Simple Voice Chat"
        url = "https://maven.maxhenkel.de/repository/public"
        content { includeGroup "de.maxhenkel.voicechat" }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // The source is written against official Mojang names (ServerPlayer, Vec3, ...).
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Simple Voice Chat: only the plugin API is needed to compile.
    compileOnly "de.maxhenkel.voicechat:voicechat-api:${project.voicechat_api_version}"

    // Immersive Portals: compile against the real mod, but don't ship or run it.
    modCompileOnly "maven.modrinth:immersiveportals:${project.immersive_portals_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = "UTF-8"
}

java {
    withSourcesJar()
}
